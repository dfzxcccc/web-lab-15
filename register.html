  <main class="container">
    <h2 class="section-title">Приєднатися до Команди</h2>
    
    <form action="#" method="POST" class="register-form">
      <fieldset>
        <legend>1. Дані гравця</legend>
        <div class="form-group">
          <label for="fullName">ПІБ Гравця:</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            required
            placeholder="Іванов Іван"
          />
        </div>
        <div class="form-group">
          <label for="email">E-mail для зв'язку:</label>
          <input type="email" id="email" name="email" required placeholder="pro_player@dota.ua" />
        </div>
        <div class="form-group">
          <label for="phone">Контактний телефон:</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            pattern="[\+]\d{12}"
            placeholder="+380991234567"
            required
            title="Формат: +380XXXXXXXXX"
          />
        </div>
      </fieldset>

      <fieldset>
        <legend>2. Ігровий профіль</legend>
        <div class="form-radio-group">
          <p>Бажана сторона:</p>
          <div class="form-radio">
            <input type="radio" id="sideRadiant" name="side" value="radiant" checked />
            <label for="sideRadiant">Radiant</label>
          </div>
          <div class="form-radio">
            <input type="radio" id="sideDire" name="side" value="dire" />
            <label for="sideDire">Dire</label>
          </div>
        </div>

        <div class="form-group">
          <label for="role">Основна роль:</label>
          <select id="role" name="role">
            <option value="hard_carry">Hard Carry (1)</option>
            <option value="mid_lane">Mid Lane (2)</option>
            <option value="offlane">Offlane (3)</option>
            <option value="soft_support">Soft Support (4)</option>
            <option value="hard_support">Hard Support (5)</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>3. Додатково</legend>
        <div class="form-group">
          <label for="about">Розкажіть про свій досвід:</label>
          <textarea id="about" name="about" rows="4" placeholder="Ваш MMR, улюблені герої, досвід у турнірах..."></textarea>
        </div>
        <div class="form-checkbox">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">Я погоджуюсь з правилами команди та кодексом поведінки</label>
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-submit">Подати заявку</button>
      </div>
    </form>
  </main>
